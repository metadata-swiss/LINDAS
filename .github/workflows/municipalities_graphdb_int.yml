name: "[MUNICIPALITIES GRAPHDB INT] Update"

on:
  schedule:
    - cron: "0 4 * * *" # gate decides; see MUNICIPALITIES_SCHEDULE_INT
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: "Build and diff only"
        required: false
        type: boolean
        default: false
      ALLOW_LARGE_CHANGE:
        description: "Bypass the removed-triples safety check"
        required: false
        type: boolean
        default: false

concurrency:
  group: municipalities-int
  cancel-in-progress: false

jobs:
  update-municipalities:
    uses: ./.github/workflows/municipalities_reusable_workflow.yml
    with:
      RUNNER: ubuntu-26.04
      ENVIRONMENT: INT
      LINDAS_UPDATE_URL: "https://int.graphdb.lindas.admin.ch/repositories/lindas/statements"
      LINDAS_QUERY_URL: "https://int.lindas.admin.ch/query"
      SCHEDULE: ${{ vars.MUNICIPALITIES_SCHEDULE_INT }}
      PUBLISH_ENABLED: true
      DRY_RUN: ${{ inputs.DRY_RUN || false }}
      ALLOW_LARGE_CHANGE: ${{ inputs.ALLOW_LARGE_CHANGE || false }}
    secrets:
      GRAPHDB_PASSWORD: ${{ secrets.GRAPHDB_PASSWORD_INT }}
      GRAPHDB_USER: ${{ secrets.GRAPHDB_USER }}
